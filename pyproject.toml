[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mission-control"
version = "1.0.0"
description = "A local control plane for contract-scoped autonomous coding runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Mission Control contributors" }]
dependencies = []

[project.scripts]
amc = "agent_mission_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

